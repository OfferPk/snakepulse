<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnakePulse results celebration QA</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <style>
      .qa-replay { position: fixed; right: 12px; bottom: 12px; width: auto; z-index: 40; }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="screen" data-screen="play">
        <div id="overlay-dead" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dead-title" tabindex="-1">
          <div class="panel">
            <h2 id="dead-title" class="dialog-title" tabindex="-1">Pulse lost</h2>
            <p id="dead-record" class="result-record" role="status" aria-live="polite" aria-atomic="true" hidden></p>
            <div class="result-stats" role="group" aria-label="Run results">
              <div class="result-stat result-stat-score"><span class="result-stat-label">Score</span><strong id="dead-score">0</strong></div>
              <div class="result-stat"><span class="result-stat-label">Best</span><strong>42</strong></div>
              <div class="result-stat"><span class="result-stat-label">Length</span><strong>15</strong></div>
              <div class="result-stat result-stat-coins"><span class="result-stat-label">Coins earned</span><strong>+6</strong></div>
            </div>
            <div class="result-actions" role="group" aria-label="Result actions">
              <button type="button" class="btn primary">Retry</button>
              <button type="button" class="btn secondary">Share</button>
              <button type="button" class="btn ghost">Home</button>
              <button type="button" class="btn secondary">Watch to continue (stub)</button>
            </div>
          </div>
        </div>
      </section>
      <button type="button" id="qa-replay" class="btn secondary qa-replay">Replay new-best celebration</button>
    </div>
    <script type="module">
      import { setPersonalBestBadge } from '../../src/game/results.ts';

      const badge = document.querySelector('#dead-record');
      const score = document.querySelector('#dead-score');
      function celebrate() {
        score.textContent = '42';
        setPersonalBestBadge(badge, 42, 31);
      }
      document.querySelector('#qa-replay').addEventListener('click', () => {
        badge.hidden = true;
        requestAnimationFrame(celebrate);
      });
      celebrate();
      document.querySelector('#dead-title').focus();
    </script>
  </body>
</html>
